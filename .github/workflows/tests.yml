name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows + Python 3.12 runs the sales tab tests about 3x slower than
    # Windows + 3.9 (14 min against 5); 20 min cancelled the job at 830 tests.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest (26.04) has no Python 3.9 build in setup-python: 3.9 runs on 24.04
        exclude:
          - {os: ubuntu-latest, python: "3.9"}
        include:
          - {os: ubuntu-24.04, python: "3.9"}
    defaults:
      run:
        # On Windows this is Git Bash (preinstalled on the runner), so `sh` exists.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python --version
          git --version
          command -v sh

      - name: Plugin tests
        run: python -m unittest discover -s tests -v

      - name: Setup skill tests
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        run: python -m unittest discover -s skills/setup/scripts -v

      - name: Design skill tests
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        run: python -m unittest discover -s skills/design/scripts -v

      - name: Panel screens are prebuilt
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        run: |
          test -f painel/web/dist/index.html
          ls painel/web/dist/assets/*.js

      - name: Panel tests
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        working-directory: painel
        run: python -B -m unittest -v

      - name: Studio tests
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        run: python -B -m unittest discover -s tune-up-studio/tests -v

      - name: Sales module tests
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        working-directory: vendas
        run: python -B -m unittest discover -s testes -t . -v

      - name: Hook entrypoint smoke test
        if: ${{ !cancelled() }}  # one red suite must not hide the next ones
        run: |
          echo '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git status"},"cwd":"."}' | python scripts/guarda.py bash

  mkt:
    name: mkt ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
        # ubuntu-latest (26.04) has no Python 3.9 build in setup-python: 3.9 runs on 24.04
        exclude:
          - {os: ubuntu-latest, python: "3.9"}
        include:
          - {os: ubuntu-24.04, python: "3.9"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Marketing module tests
        working-directory: tune-up-mkt
        run: python -B -m unittest discover -s tests -t . -v

  panel-web:
    name: panel screens (vitest + build + dist is fresh)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: painel/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - run: node --version

      - run: npm ci

      - run: npm test -- --run

      - name: Build from a clean dist
        # Tailwind scans dist/ for class names, so a build on top of an old dist
        # emits extra CSS and different hashes. Build from scratch, like the committed one.
        run: |
          rm -rf dist
          npm run build

      - name: Check dist is committed and fresh
        working-directory: .
        run: |
          git add -N painel/web/dist
          if ! git diff --exit-code -- painel/web/dist; then
            echo "::error::painel/web/dist is stale: run npm run build in painel/web and commit"
            exit 1
          fi

  wsl-pester:
    # Once per workflow (not per python): Windows PowerShell 5.1 and PowerShell 7 both run the suite.
    name: WSL installer (Pester, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Pester (instalador WSL)
        shell: powershell
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester scripts/wsl/tests -CI

      - name: Pester (instalador WSL)
        if: ${{ !cancelled() }}  # one red shell must not hide the other
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module Pester -RequiredVersion 5.7.1
          Invoke-Pester scripts/wsl/tests -CI

  wsl-conteiner:
    name: WSL scripts (ubuntu:24.04 container)
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    timeout-minutes: 30
    steps:
      # actions/checkout works without git in the image: it falls back to the REST tarball.
      - uses: actions/checkout@v4

      - name: preparar.sh in a bare container
        run: bash scripts/wsl/tests/ci_conteiner.sh
