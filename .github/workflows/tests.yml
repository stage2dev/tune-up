name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    defaults:
      run:
        # On Windows this is Git Bash (preinstalled on the runner), so `sh` exists.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show environment
        run: |
          python --version
          git --version
          command -v sh

      - name: Plugin tests
        run: python -m unittest discover -s tests -v

      - name: Setup skill tests
        run: python -m unittest discover -s skills/setup/scripts -v

      - name: Design skill tests
        run: python -m unittest discover -s skills/design/scripts -v

      - name: Hook entrypoint smoke test
        run: |
          echo '{"hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"git status"},"cwd":"."}' | python scripts/guarda.py bash
